version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` acompanha o RUNTIME, não o "latest" do npm. O runtime é
      # Node 22 em toda parte — `engines`, `.nvmrc`, os três Dockerfiles e os
      # workflows —, e tipagem de um major acima descreve API que não existe em
      # produção: o `tsc` aprova, o contêiner do cliente quebra em runtime.
      # Minor e patch dentro do 22 continuam entrando pelo grupo acima.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 não é um bump de dependência: move o plugin PostCSS para
      # `@tailwindcss/postcss` e exige migração coordenada da configuração e do
      # CSS. O Dependabot continua entregando correções 3.x; o próximo major só
      # entra por uma mudança deliberada, com build e prova visual próprios.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
